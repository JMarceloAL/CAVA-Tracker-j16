plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vigilanteservice'
version = '0.1.0'

android {
  namespace "expo.modules.vigilanteservice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService (mantém os timers do JS rodando em segundo plano).
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
}
